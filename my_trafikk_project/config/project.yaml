# Project Metadata
# This file is for reference and organization. TRAFIKK tools don't require it,
# but it's useful for documenting your project details.

project_name: "my_trafikk_project"
description: "Description of your study or research question"
date_created: "2025-MM-DD"

# Biological context
tissue: "Tissue_Name"                    # e.g., "Breast", "Colorectal", "Lung"
cell_lines: ["CellLine_1", "CellLine_2"]  # List of cell lines analyzed

# Base directory structure (all relative to project root)
paths:
  raw_data: "data/raw"
  results: "runs"
  config: "config"
  logs: "logs"
  reports: "reports"

# Project metadata
investigators:
  - name: "Your Name"
    email: "your.email@institution.org"

references:
  paper: "Your publication or preprint link"
  data_source: "Where the data came from (GDSC, CCLE, etc.)"

# Notes
notes: |
  Any additional context about this project:
  - Data preprocessing steps
  - Known issues or limitations
  - Special parameters used
