[slurm]
partition = "CPUQ"
account = "myusername"
time = "48:00:00"
nodes = 18
ntasks_per_node = 14
output = "oris_%j.out"
error = "oris_%j.err"
auto_submit = true

[env]
preamble = """
module load intel/2024a
module load SciPy-bundle/2024.05-gfbf-2024a
module load Python/3.12.3-GCCcore-13.3.0
"""

[oris]
default_sampling = 10
media_targets = ["ACVR1B", "FGFR3"]
timeout_sampling = 300
timeout_paths = 600